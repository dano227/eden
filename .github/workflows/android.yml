name: Build Eden Android APK

on:
  push:
    branches: [ "Console-Modes" ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Lizenzen akzeptieren & NDK installieren
        run: |
          echo "y" | sdkmanager --licenses
          echo "y" | sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"

      - name: Eden APK bauen
        working-directory: src/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          chmod +x gradlew
          ./gradlew assembleMainlineRelease --no-daemon

      - name: Fertige APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Eden-AutoController-APK
          path: src/android/app/build/outputs/apk/**/*.apk
