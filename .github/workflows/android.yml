
name: Build Eden Android APK

on:
  push:
    branches: [ "Console-Modes" ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: NDK, CMake und Android SDK installieren
        shell: bash
        run: |
          set -e
          echo "Android SDK: $ANDROID_SDK_ROOT"
          which sdkmanager

          sdkmanager --install \
            "ndk;26.3.11579264" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Android NDK konfigurieren
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Eden APK bauen
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleMainlineRelease --no-daemon

      - name: Fertige APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Eden-AutoController-APK
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
