
name: Build Eden Android APK

on:
  push:
    branches:
      - "Console-Modes"
      - "android-controller-assignment-pr4583"
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      # Repository herunterladen
      - name: Code herunterladen
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Java 17 installieren
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK einrichten
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      # Shader-Compiler installieren
      - name: Shader Compiler installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          which glslangValidator
          glslangValidator --version

      # Eden APK bauen
      - name: Eden APK bauen
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleMainlineRelWithDebInfo --no-daemon

      # Fertige APK als Download bereitstellen
      - name: Fertige APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Eden-AutoController-APK
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
